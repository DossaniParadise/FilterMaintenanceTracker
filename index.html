</head>

        <div class="bg-slate-900 text-white p-2 rounded-xl shadow-sm">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        </div>

      <div class="flex items-center gap-3">
        <div class="bg-slate-100 p-0.5 rounded-xl border border-slate-200 shadow-inner flex">
          <button onclick="window.setActiveTab('all')" id="tab-all" class="px-2.5 sm:px-3 py-1.5 rounded-lg text-[10px] sm:text-xs font-bold transition-all">View all</button>
          <button onclick="window.setActiveTab('ac')" id="tab-ac" class="px-2.5 sm:px-3 py-1.5 rounded-lg text-[10px] sm:text-xs font-bold transition-all">AC Filters</button>
          <button onclick="window.setActiveTab('pump')" id="tab-pump" class="px-2.5 sm:px-3 py-1.5 rounded-lg text-[10px] sm:text-xs font-bold transition-all">Pump Filters</button>
        </div>

        <div id="connection-badge" class="inline-flex items-center gap-1 px-1.5 sm:px-2.5 py-1 sm:py-1.5 rounded-full text-[10px] sm:text-xs font-semibold border transition-all shrink-0">
          <span id="connection-dot" class="h-1.5 w-1.5 sm:h-2 sm:w-2 rounded-full bg-rose-500 shrink-0"></span>
          <span id="connection-text" class="font-mono text-[9px] sm:text-xs leading-none shrink-0">Offline</span>

  <main id="main-content" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col gap-6">
    <div class="flex-1 flex flex-col items-center justify-center py-20 gap-3">
      <svg class="h-8 w-8 text-blue-600 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
      <p class="text-xs font-semibold text-slate-500 tracking-wide uppercase">Hooking into Database Stream...</p>
    </div>
  </main>

  <footer id="app-footer" class="bg-white border-t border-slate-200/80 py-4 px-4 sm:px-6 mt-auto shrink-0">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 text-slate-400">
      <div class="flex items-center gap-1 text-[10px] sm:text-xs font-medium">
        <span>© 2026 DPM Filter Changes. All rights reserved.</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md text-[9px] sm:text-[10px] font-bold font-mono bg-slate-50 hover:bg-slate-150 border border-slate-205 text-slate-500 transition-all cursor-default shadow-3xs">
          <span>v1.0.8</span>
        </span>
      </div>
    </div>
  </footer>

  <div id="modal-container"></div>
  <div id="inventory-panels-container"></div>

  <script>
    const iconWrench = `<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>`;
    const iconSearch = `<svg class="h-4 w-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`;
    const iconX = `<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
    const iconCalendar = `<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;
    const iconMessageSquare = `<svg class="h-3.5 w-3.5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;
    const iconMapPin = `<svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>`;
    const iconPlus = `<svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;
    const iconTrash2 = `<svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`;
    const iconPlay = `<svg class="h-3.5 w-3.5 fill-current" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
    const iconInfo = `<svg class="h-10 w-10 text-slate-350 mx-auto mb-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`;
    const iconAlertTriangle = `<svg class="h-3.5 w-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`;
    const iconCheck = `<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;
    const iconClipboardList = `<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>`;

    const API_BASE_URL = "https://alignment-api-khaki.vercel.app/api/dpm-alignment";
    const EDIT_PASSWORD = "filter123";

    const state = {
      activeTab: "all", searchQuery: "", activeFilter: "all", activeDepartment: "all", activeRegion: "all", activeSize: "all",
      showSizeDropdown: false, selectedStoreId: null, showBulkImport: false, modalDateStr: "", modalAcChanged: "",
      modalCoilsCleaned: "", modalCoilsCleanedDate: "", modalComments: "", modalShowAddSizes: false, modalAddSizeRows: [],
      modalShowUnitDetails: false, modalShowSizesSection: false, modalGasChanged: "", modalDieselChanged: "",
      modalGasDateStr: "", modalDieselDateStr: "", modalSaving: false, bulkTextInput: "", parsedMatches: [],
      isAnalyzed: false, isBulkSaving: false, showInventoryModal: false, showInventoryHistoryModal: false,
      selectedHistorySize: "", invDateStr: "", invSize: "", invQtyReceived: "", invTotalCost: "", invQtyDispatched: "",
      invDispatchStoreId: "", invSaving: false
    };

    let restaurants = {}, acRecords = {}, pumpRecords = {}, online = false, loading = true;

    function ref(database, path) { return path; }

    async function update(path, payload) {
      const updates = {}; updates[path] = payload;
      const resp = await fetch(API_BASE_URL, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: EDIT_PASSWORD, updates })
      });
      if (!resp.ok) throw new Error((await resp.json()).error || "API Write Error");
      await loadDashboardData();
    }

    async function loadDashboardData() {
      try {
        const resp = await fetch(API_BASE_URL);
        if (!resp.ok) throw new Error("Network response was not ok");
        const data = await resp.json();
        restaurants = data.restaurants || {};
        acRecords = data.filterChanges || {};
        pumpRecords = data.gasCoverChanges || {};
        online = true; loading = false; render();
      } catch (err) {
        console.error(err); online = false; loading = false; render();
      }
    }

    function getFirebaseSafePathKey(num) { return num ? String(num).replace(/[.#$[\]/]/g, "").replace(/\s+/g, "_").trim() : "unknown"; }
    function calculateDaysSinceChange(last) { if (!last) return null; return Math.max(0, Math.floor((Date.now() - Number(last)) / 86400000)); }
    function getStoreCategory(name) {
      if (!name) return "fastfood";
      const lc = name.toLowerCase();
      if (lc.includes("paradise") || lc.includes("pqs") || lc.includes("c-store") || lc.includes("market")) return "cstore";
      if (lc.includes("car wash") || lc.includes("carwash")) return "carwash";
      return "fastfood";
    }
    function formatStoreNameDisplay(name) { return name ? name.replace(/Paradise Quick Stop/i, "PQS").replace(/Burger King/i, "BK").replace(/\s+/g, " ").trim() : "Store"; }
    
    function getChicagoTodayDateString(ts) {
      const date = ts ? new Date(ts) : new Date();
      const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Chicago', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(date);
      const m = {}; parts.forEach(p => m[p.type] = p.value);
      return `${m.year}-${m.month}-${m.day}`;
    }
    
    function convertDateStringToChicagoTimestamp(str) {
      if (!str) return null;
      const [y, m, d] = str.split('-').map(Number);
      return new Date(y, m - 1, d, 12, 0, 0).getTime();
    }
    
    function getStoreRegion(s) {
      if (s.territory) {
        const t = String(s.territory).toLowerCase().trim();
        if (t.includes("east") || t === "e" || t === "etx") return "east";
        if (t.includes("west") || t === "w" || t === "wtx") return "west";
      }
      const val = s.longitude !== undefined ? s.longitude : (s.lng !== undefined ? s.lng : 0);
      return parseFloat(String(val)) >= -96 ? "east" : "west";
    }
    
    function getDimensionColor(val) {
      const v = (val || "").trim().toUpperCase();
      const map = {
        "20": { bg: "bg-blue-100", text: "text-blue-800", border: "border-blue-200" },
        "16": { bg: "bg-orange-100", text: "text-orange-850", border: "border-orange-200" },
        "25": { bg: "bg-purple-100", text: "text-purple-800", border: "border-purple-200" },
        "30": { bg: "bg-red-100", text: "text-red-800", border: "border-red-200" },
        "2":  { bg: "bg-green-100", text: "text-green-800", border: "border-green-200" },
        "4":  { bg: "bg-yellow-105", text: "text-yellow-805", border: "border-yellow-205" }
      };
      if (map[v]) return map[v];
      let hash = 0; for (let i = 0; i < v.length; i++) hash = v.charCodeAt(i) + ((hash << 5) - hash);
      const colors = [
        { bg: "bg-blue-50", text: "text-blue-700", border: "border-blue-200" },
        { bg: "bg-orange-50", text: "text-orange-700", border: "border-orange-200" },
        { bg: "bg-purple-50", text: "text-purple-700", border: "border-purple-200" },
        { bg: "bg-red-50", text: "text-red-700", border: "border-red-200" },
        { bg: "bg-green-50", text: "text-green-700", border: "border-green-200" }
      ];
      return colors[Math.abs(hash) % colors.length];
    }
    
    function renderDimensionBadges(sizeStr) {
      if (!sizeStr) return "";
      return `<div class="inline-flex items-center flex-wrap gap-[2px]">${sizeStr.trim().split(/([xX×])/).map(part => {
        const val = part.trim(); if (!val) return "";
        if (part.toLowerCase() === "x" || part === "×") return `<span class="text-slate-400 font-bold text-[9px] mx-[1px]">×</span>`;
        const c = getDimensionColor(val);
        return `<span class="font-mono text-[9px] font-bold ${c.bg} ${c.text} border ${c.border} rounded px-1 py-0.5 leading-none shadow-3xs">${val}</span>`;
      }).join("")}</div>`;
    }

    window.setActiveTab = (tab) => { state.activeTab = tab; state.showBulkImport = false; render(); };
    window.setRegion = (reg) => { state.activeRegion = reg; render(); };
    window.setFilter = (filt) => { state.activeFilter = filt; render(); };
    window.setCategory = (cat) => { state.activeDepartment = cat; render(); };
    window.toggleSizeDropdown = () => { state.showSizeDropdown = !state.showSizeDropdown; render(); };
    window.setActiveSize = (size) => { state.activeSize = size; state.showSizeDropdown = false; render(); };
    window.updateSearchQuery = (val) => { state.searchQuery = val; filterAndRenderCardsAndStats(); };
    window.openBulkImport = () => { state.showBulkImport = true; render(); };
    window.closeBulkImport = () => { state.showBulkImport = false; render(); };

    window.openInventoryModal = () => { 
      state.showInventoryModal = true; state.invDateStr = getChicagoTodayDateString(); state.invSize = "";
      state.invQtyReceived = ""; state.invTotalCost = ""; state.invQtyDispatched = ""; state.invDispatchStoreId = "";
      render(); 
    };
    window.closeInventoryModal = () => { state.showInventoryModal = false; render(); };
    window.openHistoryModal = (sz) => { state.selectedHistorySize = sz; state.showInventoryHistoryModal = true; render(); };
    window.closeHistoryModal = () => { state.showInventoryHistoryModal = false; render(); };
    window.updateInvField = (field, val) => { state[field] = val; render(); };

    window.handleInvInput = (field, val) => {
      state[field] = val;
      const officeRec = acRecords["76051"] || {};
      let master = {};
      try { if (officeRec.inventoryMasterState) master = JSON.parse(officeRec.inventoryMasterState); } catch(e){}
      const currentSize = state.invSize;
      const tally = currentSize ? (master[currentSize] || 0) : 0;
      const rec = parseFloat(state.invQtyReceived) || 0;
      const cost = parseFloat(state.invTotalCost) || 0;
      const disp = parseFloat(state.invQtyDispatched) || 0;
      const unitPrice = rec > 0 ? (cost / rec).toFixed(2) : "0.00";
      const leftover = tally + rec - disp;

      const upValEl = document.getElementById("unit-price-value");
      if (upValEl) upValEl.innerHTML = `$${unitPrice} per filter <span class="text-[8px] text-slate-450 font-normal">[a15]</span>`;
      
      const loEl = document.getElementById("leftover-quantity-display");
      if (loEl) {
        loEl.innerHTML = `
          <div class="flex flex-col">
            <span class="text-[9px] font-black uppercase text-slate-400 tracking-wider">Projected Leftover</span>
            <span class="text-[10px] text-blue-300 font-bold leading-none mt-1 font-sans">size: ${currentSize || "(unselected)"}</span>
          </div>
          <div class="flex items-baseline gap-1">
            <span class="text-lg font-mono font-black ${leftover < 0 ? "text-rose-400 animate-pulse" : "text-emerald-400"}">${leftover}</span>
            <span class="text-xs font-extrabold text-slate-400 font-mono">pcs</span>
            <span class="text-[8px] text-slate-400 font-bold self-start ml-1 select-none">[a18]</span>
          </div>
        `;
      }
    };

    window.saveInventoryTransaction = async () => {
      const date = state.invDateStr, size = state.invSize;
      const rec = parseInt(state.invQtyReceived, 10) || 0, cost = parseFloat(state.invTotalCost) || 0;
      const disp = parseInt(state.invQtyDispatched, 10) || 0, storeNum = state.invDispatchStoreId;
      if (!date || !size) return alert("Please select transaction date and filter size.");
      if (rec < 0 || disp < 0) return alert("Quantities cannot be negative.");
      if (rec === 0 && disp === 0) return alert("Please enter either a received quantity or a dispatched quantity.");
      if (disp > 0 && !storeNum) return alert("Please select a destination store for dispatcher.");

      let destStoreName = "";
      if (disp > 0 && storeNum) {
        const matched = Object.values(restaurants).find(s => String(s.storeNumber) === String(storeNum));
        destStoreName = matched ? matched.storeName : `Store #${storeNum}`;
      }

      const officeRecord = acRecords["76051"] || {};
      let masterMap = {};
      try { if (officeRecord.inventoryMasterState) masterMap = JSON.parse(officeRecord.inventoryMasterState); } catch(e){}
      let historyList = [];
      try { if (officeRecord.inventoryHistoryState) historyList = JSON.parse(officeRecord.inventoryHistoryState); } catch(e){}

      const currentTally = masterMap[size] || 0;
      const newTally = currentTally + rec - disp;
      if (newTally < 0 && !confirm(`Warning: Negative stock level (${newTally}). Proceed?`)) return;

      const newTx = {
        id: "tx_" + Date.now() + "_" + Math.floor(Math.random() * 1000), date, size,
        qtyReceived: rec, totalCost: cost, unitPrice: rec > 0 ? (cost / rec).toFixed(2) : "0.00",
        qtyDispatched: disp, storeNumber: storeNum || "", storeName: destStoreName || "", timestamp: Date.now()
      };

      masterMap[size] = newTally; historyList.unshift(newTx);
      state.invSaving = true; render();

      try {
        await update("filterChanges/76051", { storeNumber: "76051", inventoryMasterState: JSON.stringify(masterMap), inventoryHistoryState: JSON.stringify(historyList) });
        state.invSize = ""; state.invQtyReceived = ""; state.invTotalCost = ""; state.invQtyDispatched = ""; state.invDispatchStoreId = "";
        state.showInventoryModal = false; state.invSaving = false;
        alert("Transaction successfully committed to stock!");
        render();
      } catch (err) {
        state.invSaving = false; render();
        alert("Transaction save failed: " + err.message);
      }
    };

    window.openStore = (id) => {
      state.selectedStoreId = id; const store = restaurants[id]; if (!store) return;
      const safeKey = getFirebaseSafePathKey(store.storeNumber);
      const acRec = acRecords[safeKey] || {};
      state.modalDateStr = acRec.lastFilterChangeTimestamp ? getChicagoTodayDateString(acRec.lastFilterChangeTimestamp) : "";
      state.modalAcChanged = acRec.acChanged || (acRec.lastFilterChangeTimestamp ? "yes" : "");
      state.modalCoilsCleaned = acRec.coilsCleaned || "";
      state.modalCoilsCleanedDate = acRec.coilsCleanedDate || (acRec.coilsCleaned === "yes" && acRec.coilsCleanedTimestamp ? getChicagoTodayDateString(acRec.coilsCleanedTimestamp) : "");
      state.modalComments = acRec.comments || "";
      state.modalShowAddSizes = false; state.modalAddSizeRows = []; state.modalShowUnitDetails = false; state.modalShowSizesSection = false;
      const pumpRec = pumpRecords[safeKey] || {};
      state.modalGasChanged = pumpRec.gasChanged || ""; state.modalDieselChanged = pumpRec.dieselChanged || "";
      state.modalGasDateStr = pumpRec.gasChangedDate || ""; state.modalDieselDateStr = pumpRec.dieselChangedDate || "";
      render();
    };

    window.closeStoreModal = () => { state.selectedStoreId = null; render(); };
    window.onModalAcChanged = (val) => { state.modalAcChanged = val; state.modalDateStr = val === "yes" ? getChicagoTodayDateString() : ""; render(); };
    window.onModalDateChanged = (val) => { state.modalDateStr = val; if (val) state.modalAcChanged = "yes"; render(); };
    window.onModalCoilsCleaned = (val) => { state.modalCoilsCleaned = val; state.modalCoilsCleanedDate = val === "yes" ? getChicagoTodayDateString() : ""; render(); };
    window.onModalCoilsCleanedDateChanged = (val) => { state.modalCoilsCleanedDate = val; if (val) state.modalCoilsCleaned = "yes"; render(); };
    window.onModalGasChanged = (val) => { state.modalGasChanged = val; state.modalGasDateStr = val === "yes" ? getChicagoTodayDateString() : ""; render(); };
    window.onModalGasDateChanged = (val) => { state.modalGasDateStr = val; if (val) state.modalGasChanged = "yes"; render(); };
    window.onModalDieselChanged = (val) => { state.modalDieselChanged = val; state.modalDieselDateStr = val === "yes" ? getChicagoTodayDateString() : ""; render(); };
    window.onModalDieselDateChanged = (val) => { state.modalDieselDateStr = val; if (val) state.modalDieselChanged = "yes"; render(); };
    window.onModalCommentsChanged = (val) => { state.modalComments = val.substring(0, 250); const c = document.getElementById("comments-counter"); if (c) c.innerText = `${state.modalComments.length} / 250`; };

    window.toggleModalSizesSection = () => { state.modalShowSizesSection = !state.modalShowSizesSection; render(); };
    window.toggleModalShowUnitDetails = () => { state.modalShowUnitDetails = !state.modalShowUnitDetails; render(); };

    function parseMasterFilterBlock(text) {
      const lines = text.replace(/["“”]/g, "").split(/\r?\n/), res = []; let cur = null;
      lines.forEach(line => {
        if (!line.trim()) return;
        const norm = line.toLowerCase();
        if (norm.includes("unit") && (norm.includes("size") || norm.includes("qty"))) return;
        const cells = line.split(/\t| {2,}/).map(c => c.trim()).filter(Boolean);
        if (!cells.length) return;
        const isDim = (s) => /^\d+\s*[xX]\s*\d+/.test(s);
        if (cells.length === 1) {
          if (/[A-Za-z]/.test(cells[0]) && !/^\d+$/.test(cells[0])) res.push(cur = { rawName: cells[0], items: [] });
        } else if (cells.length >= 4) {
          res.push(cur = { rawName: cells[0], items: [{ unit: cells[1], size: normalizeSize(cells[2]), qty: cells[3] }] });
        } else if (cells.length === 3) {
          if (/[A-Za-z]/.test(cells[0]) && !/^\d+$/.test(cells[0])) {
            res.push(cur = { rawName: cells[0], items: [isDim(cells[1]) ? { unit: "1", size: normalizeSize(cells[1]), qty: cells[2] } : { unit: cells[1], size: normalizeSize(cells[2]), qty: "4" }] });
          } else if (cur) cur.items.push({ unit: cells[0], size: normalizeSize(cells[1]), qty: cells[2] });
        } else if (cells.length === 2) {
          if (isDim(cells[0]) && cur) cur.items.push({ unit: String(cur.items.length + 1), size: normalizeSize(cells[0]), qty: cells[1] });
          else if (isDim(cells[1])) {
            if (/[A-Za-z]/.test(cells[0]) && !/^\d+$/.test(cells[0])) res.push(cur = { rawName: cells[0], items: [{ unit: "1", size: normalizeSize(cells[1]), qty: "4" }] });
            else if (cur) cur.items.push({ unit: cells[0], size: normalizeSize(cells[1]), qty: "4" });
          }
        }
      });
      return res;
    }
    function normalizeSize(s) { if (!s) return ""; const c = s.trim().toUpperCase(), m = c.match(/^(\d+\s*[xX]\s*\d+(?:\s*[xX]\s*\d+)?)(.*)$/); return m ? m[1].replace(/\s+/g, "") : c; }
    function matchParsedStoreToMetadata(rawName) {
      const norm = rawName.toLowerCase(), list = Object.values(restaurants);
      let match = list.find(s => s.storeName.toLowerCase() === norm); if (match) return match;
      const hash = norm.match(/#(\d+)/); if (hash) { match = list.find(s => String(s.storeNumber) === hash[1]); if (match) return match; }
      const loose = norm.match(/\b\d{3,}\b/); if (loose) { match = list.find(s => String(s.storeNumber) === loose[0]); if (match) return match; }
      let best = null, max = 0;
      list.forEach(s => {
        let len = 0; const w1 = norm.split(/\s+/).filter(w => w.length > 2), w2 = s.storeName.toLowerCase().split(/\s+/).filter(w => w.length > 2);
        w1.forEach(w => { if (w2.includes(w)) len += w.length; });
        if (len > max) { max = len; best = s; }
      });
      return max > 4 ? b = best : null;
    }

        filtered = filtered.filter(s => (s.storeName || "").toLowerCase().includes(q) || (s.storeNumber || "").toLowerCase().includes(q) || (s.filterSize || "").toLowerCase().includes(q));

      if (state.activeFilter !== "all") {
        filtered = filtered.filter(s => {
          if (state.activeFilter === "overdue") return s.status === "state-overdue";
          if (state.activeFilter === "incomplete") return s.status === "state-incomplete";
          if (state.activeFilter === "none") return s.status === "state-none";

                    const leftover = masterMap[sz] !== undefined ? masterMap[sz] : 0;
                    let stockBg = "bg-slate-105 text-slate-805 border-slate-205";
                    if (leftover <= 0) stockBg = "bg-rose-50 text-rose-750 border-rose-250";
                    else if (leftover < 15) stockBg = "bg-amber-50 text-amber-755 border-amber-250";
                    else stockBg = "bg-emerald-50 text-emerald-755 border-emerald-250";

                    const isCurrentFormSize = String(sz).trim().toUpperCase() === String(currentSize).trim().toUpperCase();

                    return `
                      <div class="flex items-center justify-between border p-2.5 rounded-xl transition-all relative [a3] ${isCurrentFormSize ? 'bg-indigo-50/50 border-indigo-200 ring-2 ring-indigo-505/10' : 'bg-slate-50/50 hover:bg-slate-100 border-slate-150'}">
                        <span class="absolute top-1 right-2 text-[7px] text-slate-350 select-none">[a3]</span>
                        <div class="flex flex-col gap-1 w-full mr-2">
                          <button onclick="window.updateInvField('invSize', '${sz}')" class="text-left scale-90 origin-left cursor-pointer hover:opacity-80 block focus:outline-none [a4]" title="Click to select this size">
                            ${renderDimensionBadges(sz)} <span class="text-[7px] text-slate-350 font-bold select-none">[a4]</span>
                          </button>
                          <div class="flex items-center gap-1 mt-0.5">
                            <span class="text-[9px] font-bold text-slate-400">Stock:</span>
                            <span class="text-[10px] font-mono font-black px-1.5 py-0.5 rounded border leading-none ${stockBg} [a5]">
                              ${leftover} pcs <span class="text-[7px] font-normal select-none">[a5]</span>
                            </span>
                          </div>
                        </div>
                        <button onclick="window.openHistoryModal('${sz}')" class="text-[10px] font-extrabold text-blue-600 bg-blue-50 hover:bg-blue-100 border border-blue-200 px-2 py-1 rounded-lg transition-all shrink-0 cursor-pointer [a6]">
                          History <span class="text-[7px] select-none text-blue-400 font-bold">[a6]</span>
                        </button>
                      </div>
                    `;
                  }).join("")}
                </div>
              </div>

              <div class="md:col-span-7 flex flex-col gap-4">
                
                <h4 class="text-xs font-black uppercase text-indigo-700 tracking-wider pb-2 border-b border-indigo-50/50">
                  📝 Record / Log Transaction
                </h4>

                <div class="flex flex-col gap-1.5">
                  <label class="text-[11px] uppercase font-bold text-slate-500 tracking-wider flex items-center gap-1 [a11]">
                    📅 Date of Entry <span class="text-[8px] text-blue-500 font-bold ml-1">[a11]</span>
                  </label>
                  <input type="date" value="${state.invDateStr}" onchange="window.updateInvField('invDateStr', this.value)" class="w-full text-xs border border-slate-250 rounded-xl px-3 py-2.5 outline-none focus:border-slate-400 font-sans" />
                </div>

                <div class="flex flex-col gap-1.5">
                  <label class="text-[11px] uppercase font-bold text-slate-500 tracking-wider flex items-center gap-1 [a12]">
                    📏 Filter Size <span class="text-[8px] text-blue-500 font-bold ml-1">[a12]</span>
                  </label>
                  <select onchange="window.updateInvField('invSize', this.value)" class="w-full text-xs border border-slate-250 rounded-xl px-3 py-2.5 outline-none focus:border-slate-400 font-sans bg-white">
                    <option value="">-- Choose Filter Size --</option>
                    ${sizesList.map(sz => `
                      <option value="${sz}" ${sz === currentSize ? "selected" : ""}>${sz} (Current Stock: ${masterMap[sz] !== undefined ? masterMap[sz] : 0} pcs)</option>
                    `).join("")}
                  </select>
                </div>

                <div class="border-t border-slate-100 my-1"></div>

                <div class="bg-blue-50/50 p-3 rounded-xl border border-blue-100 flex flex-col gap-3">
                  <div class="text-[10px] font-extrabold uppercase text-blue-600 tracking-wider font-sans">Incoming Stock Receipts</div>
                  
                  <div class="grid grid-cols-2 gap-3">
                    <div class="flex flex-col gap-1.5">
                      <label class="text-[10px] uppercase font-bold text-slate-500 flex items-center gap-1 [a13]">
                        Qty Received <span class="text-[8px] text-blue-550 font-bold ml-1">[a13]</span>
                      </label>
                      <input type="number" min="0" placeholder="0" value="${state.invQtyReceived}" oninput="window.handleInvInput('invQtyReceived', this.value)" class="w-full text-xs border border-slate-250 rounded-xl p-2.5 outline-none focus:border-slate-400 font-mono" />
                    </div>

                    <div class="flex flex-col gap-1.5">
                      <label class="text-[10px] uppercase font-bold text-slate-500 flex items-center gap-1 [a14]">
                        Total Cost ($) <span class="text-[8px] text-blue-550 font-bold ml-1">[a14]</span>
                      </label>
                      <input type="number" min="0" step="0.01" placeholder="0.00" value="${state.invTotalCost}" oninput="window.handleInvInput('invTotalCost', this.value)" class="w-full text-xs border border-slate-250 rounded-xl p-2.5 outline-none focus:border-slate-400 font-mono" />
                    </div>
                  </div>

                  <div id="unit-price-display" class="flex items-center justify-between text-xs bg-white/70 border border-slate-200 px-3 py-2 rounded-lg [a15]">
                    <span class="text-slate-505 font-medium font-sans">Auto Unit Price Check:</span>
                    <span id="unit-price-value" class="font-mono font-bold text-slate-800">$${unitPrice} per filter <span class="text-[8px] text-slate-450 font-normal">[a15]</span></span>
                  </div>
                </div>

                <div class="bg-amber-50/30 p-3 rounded-xl border border-amber-100/70 flex flex-col gap-3">
                  <div class="text-[10px] font-extrabold uppercase text-amber-705 tracking-wider font-sans">Outgoing Stock Dispatches</div>

                  <div class="grid grid-cols-12 gap-3 items-end">
                    <div class="col-span-4 flex flex-col gap-1.5 flex-wrap">
                      <label class="text-[10px] uppercase font-bold text-slate-500 flex items-center gap-1 [a16]">
                        Qty Dispatched <span class="text-[8px] text-blue-550 font-bold ml-1">[a16]</span>
                      </label>
                      <input type="number" min="0" placeholder="0" value="${state.invQtyDispatched}" oninput="window.handleInvInput('invQtyDispatched', this.value)" class="w-full text-xs border border-slate-250 rounded-xl p-2.5 outline-none focus:border-slate-400 font-mono" />
                    </div>

                    <div class="col-span-8 flex flex-col gap-1.5 select-none">
                      <label class="text-[10px] uppercase font-bold text-slate-500 flex items-center gap-1 [a17]">
                        To Store Destination <span class="text-[8px] text-blue-550 font-bold ml-1">[a17]</span>
                      </label>
                      <select onchange="window.updateInvField('invDispatchStoreId', this.value)" class="w-full text-xs border border-slate-250 rounded-xl p-2.5 outline-none focus:border-slate-450 font-sans bg-white">
                        <option value="">-- Choose Store --</option>
                        ${storesList.map(s => `
                          <option value="${s.storeNumber}" ${String(s.storeNumber) === String(state.invDispatchStoreId) ? "selected" : ""}>#${s.storeNumber} - ${formatStoreNameDisplay(s.storeName)}</option>
                        `).join("")}
                      </select>
                    </div>
                  </div>
                </div>

                <div id="leftover-quantity-display" class="bg-slate-900 border border-slate-800 text-white p-3.5 rounded-xl flex items-center justify-between shadow-3xs [a18]">
                  <div class="flex flex-col">
                    <span class="text-[9px] font-black uppercase text-slate-400 tracking-wider">Projected Leftover</span>
                    <span class="text-[10px] text-blue-300 font-bold leading-none mt-1 font-sans">size: ${currentSize || "(unselected)"}</span>
                  </div>
                  <div class="flex items-baseline gap-1">
                    <span class="text-lg font-mono font-black ${leftoverQty < 0 ? "text-rose-400 animate-pulse" : "text-emerald-400"}">${leftoverQty}</span>
                    <span class="text-xs font-extrabold text-slate-400 font-mono">pcs</span>
                    <span class="text-[8px] text-slate-400 font-bold self-start ml-1 select-none">[a18]</span>
                  </div>
                </div>

              </div> 
            </div> 
            
            <div class="bg-slate-50 border-t border-slate-200 px-5 py-3.5 flex items-center justify-end gap-3 shrink-0">
              <button onclick="window.closeInventoryModal()" class="px-4 py-2 text-xs font-bold text-slate-600 border border-slate-200 hover:bg-slate-100 rounded-lg transition-all cursor-pointer [a20]">
                Cancel <span class="text-[8px] font-normal text-slate-400 select-none">[a20]</span>
              </button>
              <button onclick="window.saveInventoryTransaction()" ${state.invSaving ? "disabled" : ""} class="px-5 py-2 text-xs font-bold text-white bg-slate-900 hover:bg-slate-800 disabled:opacity-50 rounded-lg transition-all shadow-xs flex items-center gap-1.5 cursor-pointer [a19]">
                ${state.invSaving ? `<span class="inline-block h-3 w-3 border-2 border-white/55 border-t-white rounded-full animate-spin"></span>` : iconCheck}
                Commit Transaction <span class="text-[8px] font-mono select-none text-white/50">[a19]</span>
              </button>
            </div>

          </div>
        </div>
      `;
    }

    function renderInventoryHistoryModal() {
      const sz = state.selectedHistorySize;
      const officeRecord = acRecords["76051"] || {};
      let historyList = [];
      try { if (officeRecord.inventoryHistoryState) historyList = JSON.parse(officeRecord.inventoryHistoryState); } catch(e){}
      const filteredHistory = historyList.filter(tx => String(tx.size).trim().toUpperCase() === String(sz).trim().toUpperCase());

      return `
        <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-3xs flex items-center justify-center p-4 z-50 [a21]">
          <div class="bg-white rounded-2xl w-full max-w-2xl shadow-xl border border-slate-200 overflow-hidden flex flex-col max-h-[90vh] animate-fade-in relative font-sans">
            <div class="absolute top-2 right-2 text-[8px] font-bold text-slate-350 pointer-events-none">[a21]</div>

            <div class="bg-slate-50 border-b border-slate-200 px-5 py-3.5 flex items-center justify-between gap-4">
              <div class="flex items-center gap-2 flex-wrap">
                <h3 class="text-xs font-black uppercase text-slate-705 tracking-wider flex items-center gap-1 [a22]">
                  📜 Transaction Ledger <span class="bg-emerald-50 text-emerald-800 border border-emerald-250 text-[9px] font-mono px-1.5 py-0.5 rounded ml-1 font-bold">[a22]</span>
                </h3>
                <span class="text-slate-300">/</span>
                <div class="scale-95 origin-left">${renderDimensionBadges(sz)}</div>
              </div>
              <button onclick="window.closeHistoryModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-full transition-all hover:bg-slate-100 cursor-pointer">
                ${iconX}
              </button>
            </div>

            <div class="p-5 overflow-y-auto flex-1">
              ${filteredHistory.length === 0 ? `
                <div class="bg-slate-50 border border-dashed rounded-xl p-10 text-center text-xs text-slate-400 [a24]">
                  No transactions recorded for this size yet. Use the "Update Inventory" button to log stock receipt or dispatch events. <span class="text-[8px] font-bold select-none">[a24]</span>
                </div>
              ` : `
                <div class="overflow-x-auto">
                  <table class="w-full text-left text-xs border-collapse [a23]">
                    <thead>
                      <tr class="bg-slate-50 text-slate-500 text-[10px] uppercase font-bold tracking-wider border-b border-slate-200">
                        <th class="p-3">Date</th>
                        <th class="p-3 text-center">Type</th>
                        <th class="p-3 text-right">Received</th>
                        <th class="p-3 text-right">Dispatched</th>
                        <th class="p-3 font-semibold">Cost</th>
                        <th class="p-3">To Store</th>
                        <th class="p-3 text-slate-300 text-[8px]">[a23]</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${filteredHistory.map(tx => {
                        const isRec = tx.qtyReceived > 0;
                        return `
                          <tr class="border-b border-slate-100 font-sans hover:bg-slate-50">
                            <td class="p-3 font-mono font-bold text-slate-705">${tx.date}</td>
                            <td class="p-3 text-center">${isRec ? '<span class="text-emerald-700 bg-emerald-100 px-1.5 py-0.5 rounded font-black text-[9px]">RECEIPT</span>' : '<span class="text-amber-800 bg-amber-100 px-1.5 py-0.5 rounded font-black text-[9px]">DISPATCH</span>'}</td>
                            <td class="p-3 text-right font-mono font-black text-slate-800">${tx.qtyReceived || "-"}</td>
                            <td class="p-3 text-right font-mono font-black text-slate-800">${tx.qtyDispatched || "-"}</td>
                            <td class="p-3">${isRec ? `<strong>$${parseFloat(tx.totalCost).toFixed(2)}</strong><div class="text-[10px] text-slate-405">($${tx.unitPrice})</div>` : "-"}</td>
                            <td class="p-3 truncate max-w-[140px]">${tx.storeNumber ? `<strong>#${tx.storeNumber}</strong><div class="text-[10px] text-slate-405 truncate">${formatStoreNameDisplay(tx.storeName)}</div>` : "-"}</td>
                            <td></td>
                          </tr>
                        `;
                      }).join("")}
                    </tbody>
                  </table>
                </div>
              `}
            </div>

            <div class="bg-slate-50 border-t border-slate-200 px-5 py-3.5 flex items-center justify-end shrink-0">
              <button onclick="window.closeHistoryModal()" class="px-4 py-2 border border-slate-200 rounded-lg text-xs font-bold text-slate-655 hover:bg-slate-100 cursor-pointer select-none transition-all [a25]">
                Close Ledger <span class="text-[8px] font-normal text-slate-400 select-none">[a25]</span>
              </button>
            </div>

          </div>
        </div>
      `;
    }

    loadDashboardData();
  </script>
</body>
</html>
